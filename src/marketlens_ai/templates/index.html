<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketLens AI</title><style>body{font:15px system-ui;background:#0d1421;color:#e8eef7;max-width:1100px;margin:32px auto;padding:0 20px}button{background:#3b82f6;color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer}input,select{padding:8px;background:#172235;color:#fff;border:1px solid #33445d;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:#152033;border:1px solid #293a54;border-radius:8px;padding:16px}.muted{color:#9eb0c8}.ok{color:#65d99a}.warn{color:#f6c85f}.bad{color:#ff8b8b}pre{white-space:pre-wrap;word-break:break-word}</style><h1>MarketLens AI</h1><p class="muted">A股市场状态研究助手｜事实、证据与不确定性分离展示</p><div><input id="symbol" value="沪深300"><select id="periods"><option>20</option><option>5</option><option>60</option></select> 个交易日 <button onclick="run()">开始研究</button></div><div id="status" class="card" style="margin-top:18px">等待研究请求</div><div id="cards" class="grid"></div><div class="card" style="margin-top:14px"><h2>证据详情</h2><pre id="evidence">暂无</pre></div><div class="card" style="margin-top:14px"><h2>Ask MarketLens</h2><p class="muted">基于当前市场证据继续研究</p><input id="askq" style="width:70%" placeholder="为什么当前市场被判断为结构性分化？"><button onclick="ask()">提问</button><div id="askout" style="margin-top:12px"></div></div><script>const $=id=>document.getElementById(id);async function run(){ $('status').textContent='正在调用扶摇真实数据…';$('cards').innerHTML='';try{const r=await fetch(`/api/research?symbol=${encodeURIComponent($('symbol').value)}&periods=${$('periods').value}`);const d=await r.json();const q=d.data_quality||{};$('status').innerHTML=`<b>状态：${d.market_state?.label||'未知'}</b>　数据质量：<span class="${q.level==='充分'?'ok':'warn'}">${q.level||'未知'}</span><br><span class="muted">来源：${q.provider||''} ${q.error||''}</span>`;const ret=(d.facts||[]).map(x=>x.text).join('<br>')||'暂无足够真实数据计算区间收益';const dims=d.dimensions||{};const cards=Object.values(dims).map(x=>`<div class="card"><h3>${x.label}</h3><p><b>${x.status}</b></p><p>${x.value===undefined?'':JSON.stringify(x.value)}</p><small>${x.reason||x.proxy||''}</small></div>`).join('');const c=d.contradictions?.[0]||{};$('cards').innerHTML=cards+`<div class="card"><h3>事实</h3><p>${ret}</p></div><div class="card"><h3>矛盾雷达</h3><p>${c.status==='detected'?c.label:'当前数据不足或未发现可判断背离'}</p></div><div class="card"><h3>继续研究</h3><button onclick="follow('风格')">深入研究风格</button> <button onclick="follow('行业/风险变量')">行业/风险变量</button></div>`;$('evidence').innerHTML=(d.evidence||[]).map(e=>`<button onclick=\"showEvidence('${e.id}')\">${e.id}</button>`).join(' ')||'暂无';window._raw=d.raw||{}}catch(e){$('status').innerHTML='<span class="bad">请求失败：'+e+'</span>'}}async function follow(f){$('status').textContent='继续研究：'+f+'（继承当前指数与区间）';const r=await fetch(`/api/research?symbol=${encodeURIComponent($('symbol').value)}&periods=${$('periods').value}&focus=${encodeURIComponent(f)}`);const d=await r.json();$('evidence').textContent=JSON.stringify(d,null,2);$('status').textContent='继续研究已执行：'+f+'；'+(d.data_quality?.level||'未知')}
run(); async function ask(){const q=$('askq').value;const out=$('askout');out.textContent='基于当前 Evidence 研判中…';try{const r=await fetch('/api/research?symbol='+encodeURIComponent($('symbol').value)+'&periods='+$('periods').value);const ctx=await r.json();if((ctx.data_quality||{}).level==='不足'){out.textContent='当前研究数据不足，无法基于当前证据回答。请先重新研究或检查扶摇连接。';return}const a=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,context:{market_state:ctx.market_state,evidence:ctx.evidence,contradictions:ctx.contradictions,data_quality:ctx.data_quality,limitations:ctx.uncertainties}})});const d=await a.json();out.innerHTML='<b>'+ (d.answer||d.error||'无法回答')+'</b><br><small>Evidence: '+(d.evidence_refs||[]).join(', ')+'</small><br><small>'+ (d.limitation||'')+'</small>'}catch(e){out.textContent='Ask MarketLens 失败：'+e}}</script></html>
<script>async function showEvidence(id){$('evidence').textContent='加载证据 '+id+'…';try{const r=await fetch('/api/evidence/'+encodeURIComponent(id)+'?symbol='+encodeURIComponent($('symbol').value)+'&periods='+$('periods').value);$('evidence').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('evidence').textContent='证据加载失败：'+e}} async function loadIndustries(){try{const r=await fetch('/api/industries');const d=await r.json();if(d.status==='ok'){const items=d.raw?.item||[];document.body.insertAdjacentHTML('beforeend',`<div class="card" style="margin-top:14px"><h2>行业指数快照</h2><pre>${JSON.stringify(items,null,2)}</pre></div>`)} }catch(e){}}</script>
