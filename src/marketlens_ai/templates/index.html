<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketLens AI</title><style>body{font:15px system-ui;background:#0d1421;color:#e8eef7;max-width:1100px;margin:32px auto;padding:0 20px}button{background:#3b82f6;color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer}input,select{padding:8px;background:#172235;color:#fff;border:1px solid #33445d;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:#152033;border:1px solid #293a54;border-radius:8px;padding:16px}.muted{color:#9eb0c8}.ok{color:#65d99a}.warn{color:#f6c85f}.bad{color:#ff8b8b}pre{white-space:pre-wrap;word-break:break-word}</style><h1>MarketLens AI</h1><p class="muted">A股市场状态研究助手｜事实、证据与不确定性分离展示</p><div><input id="symbol" value="沪深300"><select id="periods"><option>20</option><option>5</option><option>60</option></select> 个交易日 <button onclick="run()">开始研究</button></div><div id="status" class="card" style="margin-top:18px">等待研究请求</div><div id="cards" class="grid"></div><div class="card" style="margin-top:14px"><h2>证据详情</h2><pre id="evidence">暂无</pre></div><script>const $=id=>document.getElementById(id);async function run(){ $('status').textContent='正在调用扶摇真实数据…';$('cards').innerHTML='';try{const r=await fetch(`/api/research?symbol=${encodeURIComponent($('symbol').value)}&periods=${$('periods').value}`);const d=await r.json();const q=d.data_quality||{};$('status').innerHTML=`<b>状态：${d.market_state?.label||'未知'}</b>　数据质量：<span class="${q.level==='充分'?'ok':'warn'}">${q.level||'未知'}</span><br><span class="muted">来源：${q.provider||''} ${q.error||''}</span>`;const ret=(d.facts||[]).map(x=>x.text).join('<br>')||'暂无足够真实数据计算区间收益';const c=d.contradictions?.[0]||{};$('cards').innerHTML=`<div class="card"><h3>事实</h3><p>${ret}</p></div><div class="card"><h3>矛盾雷达</h3><p>${c.status==='detected'?c.label:'当前数据不足或未发现可判断背离'}</p></div><div class="card"><h3>继续研究</h3><button onclick="alert('风格研究将在下一迭代接入')">深入研究风格</button> <button onclick="alert('行业/风险研究将在下一迭代接入')">行业/风险变量</button></div>`;$('evidence').textContent=JSON.stringify({evidence:d.evidence||[],raw:d.raw||{}},null,2)}catch(e){$('status').innerHTML='<span class="bad">请求失败：'+e+'</span>'}}run()</script></html>
